<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable: disabling zoom is an accessibility
         failure, and the iOS input auto-zoom it was guarding against is
         fixed at the source by 16px inputs (index.css).
         interactive-widget=resizes-content makes the Android keyboard
         shrink the layout viewport the way iOS does. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches the white app header, so the status bar blends into it. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <!-- Renders full-bleed under the iOS status bar; safe-top/safe-bottom
         in index.css pad content back below the notch/home indicator.
         "default" = dark status bar text, readable on the white header
         ("black-translucent" would draw white text over it). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>YGT · Sales CRM and invoicing for South African small businesses</title>
    <meta name="description" content="Track customers and deals, send VAT-ready quotes and tax invoices, and get paid faster. Made in South Africa, in all 11 official languages. 14-day free trial, no card needed." />
    <meta property="og:title" content="YGT · You Got This" />
    <meta property="og:description" content="Sales CRM and invoicing for South African small businesses. 14-day free trial, no card needed." />
    <meta property="og:url" content="https://yougt.co.za/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
