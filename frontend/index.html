<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable: disabling zoom is an accessibility
         failure, and the iOS input auto-zoom it was guarding against is
         fixed at the source by 16px inputs (index.css).
         interactive-widget=resizes-content makes the Android keyboard
         shrink the layout viewport the way iOS does. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Matches the white app header, so the status bar blends into it. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <!-- Renders full-bleed under the iOS status bar; safe-top/safe-bottom
         in index.css pad content back below the notch/home indicator.
         "default" = dark status bar text, readable on the white header
         ("black-translucent" would draw white text over it). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <!-- Lets people install YGT as an app (a desktop/taskbar shortcut, or
         the home screen on a phone); src/utils/install.js offers it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <title>YGT · Sales, quotes and invoicing for businesses and organisations</title>
    <meta name="description" content="One place for your customers, deals, quotes, invoices and payments. YGT follows up and chases payments for you, saving hours every week, so you can focus on running your business. 14-day free trial, no card needed." />
    <meta property="og:title" content="YGT · You Got This" />
    <meta property="og:description" content="Less admin. More business. Sales, quotes and invoicing for businesses and organisations. 14-day free trial, no card needed." />
    <meta property="og:url" content="https://yougt.co.za/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
